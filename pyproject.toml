[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prosodyedit"
version = "0.1.0"
description = "Ask an AI which words in a pre-transcribed recording deserve emphasis, and render an edited WAV."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
prosodyedit = "prosodyedit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
